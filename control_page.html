<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Home Control</title>
<style>
  *{box-sizing:border-box}
  body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;margin:0;padding:0}
  .header{padding:14px 16px 0;background:#0f172a;position:sticky;top:0;z-index:100;border-bottom:1px solid #1e293b}
  h1{color:#7c6af7;margin:0 0 2px;font-size:20px}
  .sub{color:#64748b;font-size:11px;margin-bottom:10px}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 14px;border:none;border-radius:8px 8px 0 0;font-family:system-ui;font-size:12px;font-weight:700;cursor:pointer;background:#1e293b;color:#64748b;white-space:nowrap;border-bottom:2px solid transparent}
  .tab.active{color:#7c6af7;border-bottom:2px solid #7c6af7}
  .content{padding:16px;display:none}
  .content.active{display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .device-card{background:#1e293b;border-radius:12px;padding:13px;border:1px solid #334155}
  .device-name{font-size:13px;font-weight:700;margin-bottom:3px}
  .device-status{font-size:11px;margin-bottom:9px}
  .btn-group{display:flex;gap:5px}
  .btn{flex:1;padding:8px 4px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
  .btn:active{opacity:.7}
  .btn-on{background:#4ade80;color:#0f172a}
  .btn-inactive{background:#374151;color:#6b7280}
  .btn-danger{background:#f87171;color:#0f172a}
  .btn-all-off{width:100%;padding:12px;background:#f87171;color:#0f172a;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:14px}
  .status-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:#1e293b;border-top:1px solid #334155;font-size:12px;display:none;z-index:100}
  .status-bar.show{display:block}
  .atv-card{background:#1e293b;border-radius:12px;padding:13px;border:1px solid #334155;margin-bottom:10px}
  .now-playing{font-size:11px;color:#94a3b8;margin:3px 0 8px;font-style:italic}
  input[type=range]{width:100%;accent-color:#7c6af7;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <h1>🏠 Home Control</h1>
  <div class="sub" id="subtitle">Loading...</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('security',this)">🔐 Security</button>
    <button class="tab" onclick="showTab('lights',this)">💡 Lights</button>
    <button class="tab" onclick="showTab('climate',this)">🌡️ Climate</button>
    <button class="tab" onclick="showTab('tvs',this)">📺 TVs</button>
    <button class="tab" onclick="showTab('appliances',this)">🍳 Appliances</button>
    <button class="tab" onclick="showTab('cameras',this)">📷 Cameras</button>
    <button class="tab" onclick="showTab('events',this)">📊 Events</button>
    <button class="tab" onclick="showTab('qnap',this)">🖥️ QNAP</button>
    <button class="tab" onclick="showTab('macmini',this)">🍎 Mac Mini</button>
    <button class="tab" onclick="showTab('network',this)">🌐 Network</button>
    <button class="tab" onclick="showTab('alexa',this)">🔊 Alexa</button>
    <button class="tab" onclick="showTab('smarthome',this)">🏠 Smart Home</button>
    <button class="tab" onclick="showTab('apple',this)">🍎 Apple</button>
  </div>
</div>

<div id="tab-security" class="content active" id="tab-security"></div>
<div id="tab-lights" class="content"></div>
<div id="tab-climate" class="content"></div>
<div id="tab-tvs" class="content"></div>
<div id="tab-appliances" class="content"></div>
<div id="tab-cameras" class="content"></div>
<div id="tab-events" class="content"></div>
<div id="tab-qnap" class="content"></div>
<div id="tab-macmini" class="content"></div>
<div id="tab-network" class="content"></div>
<div id="tab-alexa" class="content"></div>
<div id="tab-smarthome" class="content"></div>
<div id="tab-apple" class="content"></div>
<div id="status" class="status-bar"></div>

<script>
function showTab(name, btn) {
  _currentTab = name
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'))
  document.getElementById('tab-' + name).classList.add('active')
  btn.classList.add('active')
  if (name === 'cameras') reloadSnapshots()
  if (name === 'qnap') loadQnap()
  if (name === 'macmini') loadMacMini()
  if (name === 'network') loadNetwork()
  if (name === 'events') loadEventHistory()
  if (name === 'alexa') loadAlexa()
  if (name === 'smarthome') loadSmartHome()
  if (name === 'apple') loadApple()
}

async function loadMacMini() {
  const el = document.getElementById('tab-macmini')
  el.innerHTML = '<p style="color:var(--muted)">Loading Mac Mini data…</p>'
  try {
    const r = await fetch('/api/macmini')
    const d = await r.json()
    if (d.error) { el.innerHTML = `<p style="color:#f87171">⚠ ${d.error}</p>`; return }

    const gauge = (label, pct, color) => `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
          <span style="color:#94a3b8">${label}</span><span style="color:${color};font-weight:700">${pct}%</span>
        </div>
        <div style="background:#334155;border-radius:4px;height:6px">
          <div style="background:${color};width:${Math.min(pct,100)}%;height:6px;border-radius:4px"></div>
        </div>
      </div>`

    const cpuColor = d.cpu > 80 ? '#f87171' : d.cpu > 50 ? '#fbbf24' : '#4ade80'
    const memColor = d.mem_pct > 80 ? '#f87171' : d.mem_pct > 60 ? '#fbbf24' : '#4ade80'
    const diskColor = d.disk_pct > 80 ? '#f87171' : d.disk_pct > 60 ? '#fbbf24' : '#4ade80'

    const procRows = (d.processes||[]).map(p => `
      <tr>
        <td style="padding:4px 8px;color:#94a3b8">${p.pid}</td>
        <td style="padding:4px 8px">${p.name}</td>
        <td style="padding:4px 8px;color:#7c6af7">${p.mem}%</td>
        <td style="padding:4px 8px;color:#64748b">${p.rss}</td>
        <td style="padding:4px 8px;color:#4ade80">${p.cpu}%</td>
      </tr>`).join('')

    const serviceRows = (d.services||[]).map(s => `
      <tr>
        <td style="padding:4px 8px;color:#7c6af7">${s.port}</td>
        <td style="padding:4px 8px">${s.process}</td>
        <td style="padding:4px 8px;color:#64748b">${s.pid}</td>
        <td style="padding:4px 8px;color:#94a3b8">${s.description||''}</td>
      </tr>`).join('')

    const agentRows = (d.agents||[]).map(a => `
      <tr>
        <td style="padding:4px 8px"><span style="color:${a.running?'#4ade80':'#64748b'}">${a.running?'●':'○'}</span></td>
        <td style="padding:4px 8px;font-size:11px">${a.label}</td>
        <td style="padding:4px 8px;font-size:10px;color:#64748b">${a.script||''}</td>
      </tr>`).join('')

    el.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div>
          <div style="font-size:15px;font-weight:700">Gary's Mac Mini</div>
          <div style="font-size:11px;color:#64748b">${d.model||''} · Up ${d.uptime||''}</div>
        </div>
        <span style="color:#4ade80;font-size:12px">● Local</span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
        <div style="background:#1e293b;border-radius:10px;padding:12px;border:1px solid #334155">
          ${gauge('CPU', d.cpu||0, cpuColor)}
          ${gauge('Memory', d.mem_pct||0, memColor)}
          ${gauge('Disk', d.disk_pct||0, diskColor)}
        </div>
        <div style="background:#1e293b;border-radius:10px;padding:12px;border:1px solid #334155">
          <div style="font-size:11px;color:#64748b;margin-bottom:6px">MEMORY</div>
          <div style="font-size:18px;font-weight:700;color:#7c6af7">${d.mem_used||'-'} <span style="font-size:11px;color:#64748b">GB used</span></div>
          <div style="font-size:11px;color:#64748b">${d.mem_total||'-'} GB total</div>
        </div>
        <div style="background:#1e293b;border-radius:10px;padding:12px;border:1px solid #334155">
          <div style="font-size:11px;color:#64748b;margin-bottom:8px">STORAGE</div>
          ${(d.disks||[{label:'Internal SSD',pct:d.disk_pct||0,free:d.disk_free||'-',total:d.disk_total||'-'}]).map(dk => {
            const dc = dk.pct > 80 ? '#f87171' : dk.pct > 60 ? '#fbbf24' : '#4ade80'
            return '<div style="margin-bottom:8px">' +
              '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">' +
                '<span style="color:#94a3b8">' + dk.label + '</span>' +
                '<span style="color:' + dc + ';font-weight:700">' + dk.pct + '%</span>' +
              '</div>' +
              '<div style="background:#334155;border-radius:4px;height:5px;margin-bottom:2px">' +
                '<div style="background:' + dc + ';width:' + Math.min(dk.pct,100) + '%;height:5px;border-radius:4px"></div>' +
              '</div>' +
              '<div style="font-size:10px;color:#64748b">' + dk.free + ' free of ' + dk.total + '</div>' +
            '</div>'
          }).join('')}
        </div>
      </div>

      ${procRows ? `
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Top Processes</div>
        <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:16px">
          <tr><th style="text-align:left;padding:4px 8px;color:#64748b">PID</th><th style="text-align:left;padding:4px 8px;color:#64748b">Process</th><th style="text-align:left;padding:4px 8px;color:#64748b">Mem%</th><th style="text-align:left;padding:4px 8px;color:#64748b">RSS</th><th style="text-align:left;padding:4px 8px;color:#64748b">CPU%</th></tr>
          ${procRows}
        </table>` : ''}

      ${serviceRows ? `
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Listening Services</div>
        <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:16px">
          <tr><th style="text-align:left;padding:4px 8px;color:#64748b">Port</th><th style="text-align:left;padding:4px 8px;color:#64748b">Process</th><th style="text-align:left;padding:4px 8px;color:#64748b">PID</th><th style="text-align:left;padding:4px 8px;color:#64748b">Description</th></tr>
          ${serviceRows}
        </table>` : ''}

      ${agentRows ? `
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Launch Agents</div>
        <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:16px">
          <tr><th style="text-align:left;padding:4px 8px;color:#64748b">Status</th><th style="text-align:left;padding:4px 8px;color:#64748b">Label</th><th style="text-align:left;padding:4px 8px;color:#64748b">Script</th></tr>
          ${agentRows}
        </table>` : ''}

      <button onclick="loadMacMini()" style="background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">⟳ Refresh</button>
    `
  } catch(e) {
    el.innerHTML = `<p style="color:#f87171">Error: ${e.message}</p>`
  }
}

async function loadQnap() {
  const el = document.getElementById('tab-qnap')
  el.innerHTML = '<p style="color:var(--muted)">Loading QNAP data…</p>'
  try {
    const r = await fetch('/api/qnap')
    const d = await r.json()
    if (d.error) { el.innerHTML = `<p style="color:#f87171">⚠ ${d.error}</p>`; return }

    const si = d.sysinfo || {}
    const cpuPct = si.cpu_usage || 0
    const memPct = si.mem_total ? Math.round(si.mem_used/si.mem_total*100) : 0

    const gauge = (label, pct, color) => `
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
          <span style="color:#94a3b8">${label}</span><span style="color:${color};font-weight:700">${pct}%</span>
        </div>
        <div style="background:#334155;border-radius:4px;height:6px">
          <div style="background:${color};width:${pct}%;height:6px;border-radius:4px"></div>
        </div>
      </div>`

    const volHtml = (d.volumes||[]).map(v => {
      const c = v.used_pct > 80 ? '#f87171' : v.used_pct > 60 ? '#fbbf24' : '#4ade80'
      return `<div style="background:#1e293b;border-radius:10px;padding:12px;border:1px solid #334155;margin-bottom:8px">
        <div style="font-size:12px;font-weight:700;margin-bottom:6px">${v.label}</div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:4px">
          <span>${v.used} used of ${v.total}</span><span style="color:${c}">${v.used_pct}%</span>
        </div>
        <div style="background:#334155;border-radius:4px;height:6px">
          <div style="background:${c};width:${v.used_pct}%;height:6px;border-radius:4px"></div>
        </div>
        <div style="font-size:10px;color:#64748b;margin-top:4px">${v.status} · ${v.fsType}</div>
      </div>`
    }).join('')

    const tmHtml = (d.tmBundles||[]).map(b => {
      const last = b.lastBackup ? new Date(b.lastBackup).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}) : 'Unknown'
      return `<div style="font-size:12px;padding:4px 0;border-bottom:1px solid #334155">
        <span style="color:#e2e8f0">${b.machine}</span>
        <span style="float:right;color:#64748b">${last}</span>
      </div>`
    }).join('')

    const diskHtml = (d.disks||[]).map(dk => {
      const tempColor = dk.temp > 45 ? '#f87171' : dk.temp > 38 ? '#fbbf24' : '#4ade80'
      const healthColor = dk.health === 'Good' ? '#4ade80' : '#f87171'
      return `<tr>
        <td style="padding:5px 8px">${dk.slot||dk.label||dk.id}</td>
        <td style="padding:5px 8px;color:#94a3b8;font-size:11px">${dk.model||'-'}</td>
        <td style="padding:5px 8px;color:${tempColor}">${dk.temp ? dk.temp+'°C' : '-'}</td>
        <td style="padding:5px 8px;color:${healthColor}">${dk.health||'-'}</td>
        <td style="padding:5px 8px;color:#64748b">${dk.capacity||'-'}</td>
      </tr>`
    }).join('')

    el.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div>
          <div style="font-size:15px;font-weight:700">${si.hostname||'GarysNas'}</div>
          <div style="font-size:11px;color:#64748b">${si.model||''} · Up ${si.uptime||''}</div>
        </div>
        <span style="color:#4ade80;font-size:12px">● Connected</span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        <div style="background:#1e293b;border-radius:10px;padding:12px;border:1px solid #334155">
          ${gauge('CPU', cpuPct, cpuPct>80?'#f87171':cpuPct>50?'#fbbf24':'#4ade80')}
          ${gauge('Memory', memPct, memPct>80?'#f87171':memPct>60?'#fbbf24':'#4ade80')}
        </div>
        <div style="background:#1e293b;border-radius:10px;padding:12px;border:1px solid #334155">
          <div style="font-size:11px;color:#64748b;margin-bottom:6px">MEMORY</div>
          <div style="font-size:18px;font-weight:700;color:#7c6af7">${si.mem_used?.toLocaleString()||'-'} <span style="font-size:11px;color:#64748b">MB used</span></div>
          <div style="font-size:11px;color:#64748b">${si.mem_total?.toLocaleString()||'-'} MB total</div>
        </div>
      </div>

      <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Storage Volumes</div>
      ${volHtml}

      ${diskHtml ? `
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 8px">Drives</div>
        <table style="width:100%;font-size:12px;border-collapse:collapse">
          <tr><th style="text-align:left;padding:5px 8px;color:#64748b">Drive</th><th style="text-align:left;padding:5px 8px;color:#64748b">Model</th><th style="text-align:left;padding:5px 8px;color:#64748b">Temp</th><th style="text-align:left;padding:5px 8px;color:#64748b">Health</th><th style="text-align:left;padding:5px 8px;color:#64748b">Size</th></tr>
          ${diskHtml}
        </table>` : ''}

      ${tmHtml ? `
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 8px">Time Machine Backups</div>
        <div style="background:#1e293b;border-radius:10px;padding:12px;border:1px solid #334155">${tmHtml}</div>` : ''}

      <button onclick="loadQnap()" style="margin-top:12px;background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">⟳ Refresh</button>
    `
  } catch(e) {
    el.innerHTML = `<p style="color:#f87171">Error: ${e.message}</p>`
  }
}

function reloadSnapshots() {
  document.querySelectorAll('#tab-cameras img').forEach((img, i) => {
    setTimeout(() => {
      const base = img.src.split('?')[0]
      img.style.display = 'block'
      if (img.nextElementSibling) img.nextElementSibling.style.display = 'none'
      const newImg = new Image()
      newImg.onload = () => { img.src = newImg.src }
      newImg.onerror = () => { img.style.display = 'none'; if (img.nextElementSibling) img.nextElementSibling.style.display = 'block' }
      newImg.src = base + '?t=' + Date.now()
    }, i * 1500)
  })
}

function showStatus(msg) {
  const el = document.getElementById('status')
  el.textContent = msg
  el.className = 'status-bar show'
  setTimeout(() => el.classList.remove('show'), 3000)
}

let lastHash = null
let _currentTab = 'security'

function refreshCurrentTab() {
  const loaders = {
    qnap: loadQnap, macmini: loadMacMini, network: loadNetwork,
    events: loadEventHistory, alexa: loadAlexa, smarthome: loadSmartHome,
    apple: loadApple, cameras: reloadSnapshots
  }
  const fn = loaders[_currentTab]
  if (fn) fn()
  else {
    // Static tabs (security, lights, climate, tvs, appliances) — just refresh states
    fetchPowerStates()
    loadHueBrightness()
    loadSensorEvents()
  }
}

async function checkHash() {
  try {
    const r = await fetch('/control/state-hash')
    const d = await r.json()
    if (lastHash && lastHash !== d.hash) refreshCurrentTab()
    lastHash = d.hash
  } catch(e) {}
}
checkHash()
setInterval(checkHash, 5000)

async function hueCmd(uniqueid, on) {
  showStatus('Sending...')
  const r = await fetch('/control/hue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({uniqueid, on}) })
  const d = await r.json()
  showStatus(d.ok ? '✓ Done' : '✗ ' + d.error)
}

async function setpointCmd(temp) {
  showStatus('Setting to ' + temp + '°F...')
  const r = await fetch('/control/smartthings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({deviceId:'904f48c1-b6ef-4b03-b311-65a7733a967d', capability:'thermostatCoolingSetpoint', command:'setCoolingSetpoint', args:[temp]}) })
  const d = await r.json()
  if (d.ok) {
    showStatus('✓ Set to ' + temp + '°F')
    document.querySelectorAll('input[type=range]').forEach(s => { s.value = temp; s.previousElementSibling.children[1].textContent = temp + '°F' })
  } else showStatus('✗ ' + d.error)
}

async function sonosVolCmd(ip, volume) {
  showStatus('Setting Sonos volume to ' + volume + '%...')
  const r = await fetch('/control/sonos', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ip, cmd:'volume', volume}) })
  const d = await r.json()

let _alexaDevices = []
let _alexaSort = { col: 'name', dir: 1 }

function renderAlexaTable() {
  const sorted = [..._alexaDevices].sort((a, b) => {
    const col = _alexaSort.col
    const av = col === 'online' ? (a.online ? 1 : 0) : (a[col] || '').toLowerCase()
    const bv = col === 'online' ? (b.online ? 1 : 0) : (b[col] || '').toLowerCase()
    return av < bv ? -_alexaSort.dir : av > bv ? _alexaSort.dir : 0
  })

  const familyIcon = { 'ECHO': '🔈', 'TABLET': '📱', 'FIRE_TV': '📺', 'KNIGHT': '🔊', 'ECHO_AUTO': '🚗' }
  const rows = sorted.map(function(dv) {
    const icon = familyIcon[dv.family] || '🔊'
    const serial = dv.serial || ''
    const onlineColor = dv.online ? '#4ade80' : '#64748b'
    const onlineLabel = dv.online ? '● Online' : '○ Offline'
    const dndId = 'dnd_' + serial.substring(0,8)
    return '<tr style="border-bottom:1px solid #1e293b">' +
      '<td style="padding:8px;color:#e2e8f0;font-weight:600;white-space:nowrap">' + icon + ' ' + (dv.name || '—') + '</td>' +
      '<td style="padding:8px;color:#94a3b8;font-size:11px;white-space:nowrap">' + (dv.family || '—') + '</td>' +
      '<td style="padding:8px;color:' + onlineColor + ';font-size:11px;font-weight:600;white-space:nowrap">' + onlineLabel + '</td>' +
      '<td style="padding:8px;white-space:nowrap">' +
        '<button onclick="alexaCmd(\'' + serial + '\',\'play\',null)" style="background:#1e40af;border:none;color:#fff;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px;margin-right:4px">▶</button>' +
        '<button onclick="alexaCmd(\'' + serial + '\',\'pause\',null)" style="background:#475569;border:none;color:#fff;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px">⏸</button>' +
      '</td>' +
      '<td style="padding:8px;white-space:nowrap">' +
        '<input id="vol_' + serial.substring(0,8) + '" type="range" min="0" max="100" value="50" style="width:80px;vertical-align:middle"> ' +
        '<button onclick="alexaCmd(\'' + serial + '\',\'volume\',document.getElementById(\'vol_' + serial.substring(0,8) + '\').value)" style="background:#7c3aed;border:none;color:#fff;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px">Set Vol</button>' +
      '</td>' +
      '<td style="padding:8px;white-space:nowrap">' +
        '<label style="font-size:11px;color:#94a3b8">DND ' +
        '<input id="' + dndId + '" type="checkbox" onchange="alexaCmd(\'' + serial + '\',\'donotdisturb\',this.checked.toString())" style="margin-left:4px">' +
        '</label>' +
      '</td>' +
    '</tr>'
  }).join('')

  const th = (label, col) => {
    const active = _alexaSort.col === col
    const arrow = active ? (_alexaSort.dir === 1 ? ' ▲' : ' ▼') : ''
    return '<th onclick="alexaSortBy(\'' + col + '\')" style="text-align:left;padding:6px 8px;color:' + (active ? '#7c6af7' : '#64748b') + ';font-weight:600;cursor:pointer;user-select:none">' + label + arrow + '</th>'
  }

  document.getElementById('alexa-table-wrap').innerHTML =
    '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
      '<thead><tr style="border-bottom:1px solid #334155">' +
        th('Device','name') + th('Family','family') + th('Status','online') +
        '<th style="padding:6px 8px;color:#64748b;font-weight:600">Play/Pause</th>' +
        '<th style="padding:6px 8px;color:#64748b;font-weight:600">Volume</th>' +
        '<th style="padding:6px 8px;color:#64748b;font-weight:600">DND</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>'
}

function alexaSortBy(col) {
  if (_alexaSort.col === col) _alexaSort.dir *= -1
  else { _alexaSort.col = col; _alexaSort.dir = 1 }
  renderAlexaTable()
}

async function alexaCmd(serial, command, value) {
  const btn = event && event.target
  if (btn) { btn.disabled = true; btn.style.opacity = '0.5' }
  try {
    const r = await fetch('/api/alexa-command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ serial, command, value })
    })
    const d = await r.json()
    if (d.error) alert('Error: ' + d.error)
  } catch(e) { alert('Error: ' + e.message) }
  finally { if (btn) { btn.disabled = false; btn.style.opacity = '1' } }
}

let _shLockIds = []
const _roomPids = {}  // room name → [{endpointId, pid, name}]
const _recentlyToggled = {}  // pid → timestamp, skip poll overrides for 15s
const _nameToPid = {}  // lowercase device name → pid
const _hueIdByPid = {}   // pid → Hue light numeric ID (for direct Hue API control)
const _ringKeyByPid = {} // pid → Ring device name key (for direct Ring API control)

async function loadSensorEvents() {
  try {
    const r = await fetch('/api/ring-sensor-events')
    const events = await r.json()
    const now = Date.now()
    for (const { name, sKey, isMailbox } of _sensorIds) {
      const stateEl = document.getElementById(sKey + '_state')
      const timeEl  = document.getElementById(sKey + '_time')
      const durEl   = document.getElementById(sKey + '_dur')
      if (!stateEl) continue
      // Find event by exact or partial name match
      const nameLower = name.toLowerCase()
      const key = Object.keys(events).find(k => k.toLowerCase().includes(nameLower) || nameLower.includes(k.toLowerCase()))
      if (!key) { stateEl.textContent = 'No events'; timeEl.textContent = ''; continue }
      const ev = events[key]
      const evTime = new Date(ev.time)
      const ageSec = Math.floor((now - evTime.getTime()) / 1000)
      const ageStr = ageSec < 60 ? ageSec + 's ago'
        : ageSec < 3600 ? Math.floor(ageSec/60) + 'm ago'
        : ageSec < 86400 ? Math.floor(ageSec/3600) + 'h ago'
        : Math.floor(ageSec/86400) + 'd ago'
      const isOpen = (ev.state || '').toLowerCase().includes('open') || (ev.motion === true)
      const stateLabel = isMailbox
        ? (isOpen ? '📬 Opened' : '📪 Closed')
        : (isOpen ? '🟡 Motion' : '⚫ Clear')
      const color = isOpen ? '#fbbf24' : '#64748b'
      stateEl.textContent = stateLabel
      stateEl.style.color = color
      timeEl.textContent = 'Last: ' + evTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + ' · ' + ageStr
      if (durEl) durEl.textContent = ev.state ? ('State: ' + ev.state) : ''
    }
  } catch(e) { console.warn('Sensor events failed:', e) }
}

async function loadCameraBatteries() {
  try {
    const r = await fetch('/api/ring-camera-batteries')
    const batteries = await r.json()
    const normalize = s => s.toLowerCase().replace(/\s*(camera|doorbell|cam|ring)\s*/gi, '').trim()
    for (const { name, camKey } of _camBatteryIds) {
      const el = document.getElementById(camKey + '_batt')
      if (!el) continue
      const nameLower = name.toLowerCase()
      const nameNorm = normalize(name)
      // 1. Exact match  2. Fuzzy contains  3. Normalized match
      let b = batteries[name]
      if (!b) {
        const key = Object.keys(batteries).find(k => {
          const kl = k.toLowerCase(), kn = normalize(k)
          return kl.includes(nameLower) || nameLower.includes(kl) || kn === nameNorm || kn.includes(nameNorm) || nameNorm.includes(kn)
        })
        if (key) b = batteries[key]
      }
      if (!b) { el.textContent = '🔌 Wired'; continue }
      const pct = b.battery2 != null ? Math.min(b.battery, b.battery2) : b.battery
      const color = pct > 50 ? '#4ade80' : pct > 20 ? '#fbbf24' : '#f87171'
      const label = b.battery2 != null ? `${b.battery}% / ${b.battery2}%` : `${b.battery}%`
      el.innerHTML = '<span style="color:' + color + '">🔋 ' + label + '</span>'
    }
  } catch(e) { console.warn('Camera battery fetch failed:', e) }
}

function applyPowerState(pid, isOn, fromPoll) {
  const btn = document.getElementById(pid + '_toggle')
  if (!btn) return
  if (!fromPoll) _recentlyToggled[pid] = Date.now()
  // Green = off (safe), Red = on (active)
  btn.textContent = isOn ? 'On' : 'Off'
  btn.style.background  = isOn ? '#7f1d1d' : '#166534'
  btn.style.borderColor = isOn ? '#f87171' : '#4ade80'
  btn.style.color = '#fff'
  btn.dataset.state = isOn ? 'on' : 'off'
  const pctEl = document.getElementById(pid + '_pct')
  if (pctEl && !isOn) pctEl.textContent = ''
  if (!isOn && !fromPoll) document.querySelectorAll(`[data-pid-color="${pid}"]`).forEach(b => { b.style.borderColor = '#334155'; b.style.boxShadow = '' })
}

function applyLockState(pid, isLocked) {
  const btn = document.getElementById(pid + '_toggle')
  if (!btn) return
  btn.textContent = isLocked ? '🔒 Locked' : '🔓 Unlocked'
  btn.style.background  = isLocked ? '#166534' : '#7f1d1d'
  btn.style.borderColor = isLocked ? '#4ade80' : '#f87171'
  btn.style.color = isLocked ? '#fff' : '#fca5a5'
  btn.dataset.state = isLocked ? 'locked' : 'unlocked'
}

const HUE_NAME_ALIASES = {
  'floodlight': 'downstairs patio door',
  'left lamp':  "gary's lamp",
  'right lamp': "pam's lamp"
}

async function loadHueBrightness() {
  try {
    const r = await fetch('/api/hue-light-states')
    const hue = await r.json()
    if (hue.error) return
    for (const [hueName, state] of Object.entries(hue)) {
      const lookupName = HUE_NAME_ALIASES[hueName] || hueName
      const pid = _nameToPid[lookupName]
      if (!pid) continue
      if (state.id) _hueIdByPid[pid] = state.id  // cache Hue light ID for direct control
      applyBrightness(pid, state.bri)
      if (state.on !== undefined) applyPowerState(pid, state.on, true)
    }
  } catch(e) { console.warn('Hue brightness fetch failed:', e) }
}

async function hueControl(pid, body) {
  const lightId = _hueIdByPid[pid]
  if (!lightId) return false  // not a Hue light
  await fetch('/api/hue-control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lightId, ...body })
  })
  return true
}

async function ringControl(pid, on) {
  const deviceKey = _ringKeyByPid[pid]
  if (!deviceKey) return false  // not a Ring light
  await fetch('/control/ring', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ deviceKey, on })
  })
  return true
}

async function loadRingStates() {
  try {
    const r = await fetch('/api/ring-light-states')
    const lights = await r.json()
    if (lights.error) return
    for (const [ringKey, state] of Object.entries(lights)) {
      const pid = _nameToPid[ringKey] || _nameToPid[state.name?.toLowerCase()]
      if (!pid) continue
      _ringKeyByPid[pid] = ringKey  // cache for control
      applyPowerState(pid, state.on, true)
    }
  } catch(e) { console.warn('Ring states fetch failed:', e) }
}

async function fetchPowerStates() {
  const allIds = [..._shPowerIds, ..._shLockIds]
  if (!allIds.length) return
  try {
    const r = await fetch('/api/alexa-power-states', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpointIds: allIds.map(x => x.endpointId) })
    })
    const d = await r.json()
    const now = Date.now()
    for (const { endpointId, pid } of _shPowerIds) {
      if (endpointId in (d.states || {})) {
        if (!_recentlyToggled[pid] || now - _recentlyToggled[pid] > 15000) {
          applyPowerState(pid, d.states[endpointId], true)
        }
      }
    }
    for (const { endpointId, pid } of _shLockIds) {
      if (endpointId in (d.lockStates || {})) applyLockState(pid, d.lockStates[endpointId])
    }
    for (const { endpointId, pid } of _shPowerIds) {
      if (endpointId in (d.brightnessStates || {})) applyBrightness(pid, d.brightnessStates[endpointId])
    }
  } catch(e) { console.warn('Power state fetch failed:', e.message) }
}

function updateRoomToggleButtons() {
  document.querySelectorAll('[id^="roomtoggle_"]').forEach(btn => {
    const deviceNamesStr = btn.dataset.devices
    if (!deviceNamesStr) return
    const anyOn = deviceNamesStr.split('|').some(name => {
      const dev = _shPowerIds.find(d => d.name === name)
      if (!dev) return false
      const tb = document.getElementById(dev.pid + '_toggle')
      return tb?.dataset.state === 'on'
    })
    btn.textContent = anyOn ? 'All Off' : 'All On'
    btn.style.background = anyOn ? '#7f1d1d' : '#166534'
    btn.style.borderColor = anyOn ? '#ef4444' : '#4ade80'
  })
}

async function shToggle(endpointId, pid) {
  const btn = document.getElementById(pid + '_toggle')
  const isOn = btn?.dataset.state === 'on'
  applyPowerState(pid, !isOn) // optimistic
  // Prefer direct Hue → Ring → Alexa
  const usedHue = await hueControl(pid, { on: !isOn })
  const usedRing = !usedHue && await ringControl(pid, !isOn)
  if (!usedHue && !usedRing) {
    const devInfo = _shPowerIds.find(d => d.endpointId === endpointId)
    await shControl(endpointId, isOn ? 'TurnOff' : 'TurnOn', null, devInfo?.name)
  }
  setTimeout(loadHueBrightness, 1200)
  setTimeout(loadRingStates, 1200)
  if (!usedHue && !usedRing) setTimeout(fetchPowerStates, 1500)
}

async function roomOff(room) {
  const devs = _shPowerIds.filter(d => d.room === room)
  console.log('[roomOff]', room, devs.length, 'devices', JSON.stringify(devs.map(d=>d.name)))
  for (const { endpointId, pid, name } of devs) {
    applyPowerState(pid, false)
    const usedHue = await hueControl(pid, { on: false })
    const usedRing = !usedHue && await ringControl(pid, false)
    if (!usedHue && !usedRing) await shControl(endpointId, 'TurnOff', null, name)
  }
}

async function roomToggleByNames(btn, deviceNamesStr) {

  btn.style.background = turningOff ? '#166534' : '#7f1d1d'

    if (!usedHue && !usedRing) await shControl(dev.endpointId, turningOff ? 'TurnOff' : 'TurnOn', null, dev.name)
  }
}

async function roomOffByNames(deviceNamesStr) {
  const names = deviceNamesStr.split('|')
  for (const name of names) {

    if (!dev) continue
    applyPowerState(dev.pid, false)
    const usedHue = await hueControl(dev.pid, { on: false })
    const usedRing = !usedHue && await ringControl(dev.pid, false)
    if (!usedHue && !usedRing) await shControl(dev.endpointId, 'TurnOff', null, dev.name)

}

async function lockToggle(endpointId, pid) {
  const btn = document.getElementById(pid + '_toggle')
  const isLocked = btn?.dataset.state !== 'unlocked'
  applyLockState(pid, !isLocked) // optimistic
  await shControl(endpointId, isLocked ? 'Unlock' : 'Lock', null)
  setTimeout(fetchPowerStates, 2000)
}

const _tccMode = {}      // tid → current mode
const _tccSetpoint = {}  // tid → current displayed setpoint
const _tccSetTimer = {}  // tid → debounce timer

function tccAdjust(tid, delta) {
  const valEl = document.getElementById(tid + '_val')
  if (!valEl) return
  const current = parseInt(valEl.textContent) || 72
  const next = Math.min(85, Math.max(60, current + delta))
  _tccSetpoint[tid] = next
  valEl.textContent = next + '°'
  // Auto-set after 1.5s of no presses
  clearTimeout(_tccSetTimer[tid])
  _tccSetTimer[tid] = setTimeout(() => tccSetTemp(tid), 1500)

async function loadThermostatState(endpointId, tid) {
  try {
    const r = await fetch('/api/tcc-thermostat')
    const p = await r.json()
    if (p.error) throw new Error(p.error)
    const modeColors = { HEAT: '#fb923c', COOL: '#93c5fd', AUTO: '#a78bfa', OFF: '#6b7280', EMHEAT: '#f97316' }
    // Current temp
    if (p.currentTemp != null) document.getElementById(tid + '_curr').textContent = Math.round(p.currentTemp) + '°'
    // Setpoint — show heat setpoint when heating/auto, cool when cooling
    const setpoint = (p.mode === 'COOL') ? p.coolSetpoint : p.heatSetpoint
    if (setpoint != null) {
      const t = Math.round(setpoint)
      _tccSetpoint[tid] = t
      const valEl = document.getElementById(tid + '_val')
      if (valEl) valEl.textContent = t + '°'
    }
    // Mode + operating status
    _tccMode[tid] = p.mode
    const statusEl = document.getElementById(tid + '_status')
    if (p.mode) {
      const opLower = (p.operating || '').toLowerCase()
      let opLabel = ''
      if (opLower === 'cooling' || opLower === '2') opLabel = '❄️ Cooling'
      else if (opLower === 'heating' || opLower === '1') opLabel = '🔥 Heating'
      else if (opLower === 'fan' || opLower === '3') opLabel = '💨 Fan'
      statusEl.textContent = opLabel || p.mode
      statusEl.style.color = opLabel ? '#fff' : (modeColors[p.mode] || '#64748b')
      for (const m of ['HEAT','COOL','AUTO','OFF']) {
        const btn = document.getElementById(tid + '_m_' + m)
        if (btn) btn.style.borderColor = m === p.mode ? (modeColors[m] || '#7c6af7') : 'transparent'
      }
    } else {
      statusEl.textContent = 'State unavailable'
    }
    // Fan mode buttons
    const fanOn = document.getElementById(tid + '_fan_on')
    const fanAuto = document.getElementById(tid + '_fan_auto')
    if (fanOn && fanAuto) {
      const isOn = (p.fanMode || '').toLowerCase() === 'on'
      fanOn.style.borderColor = isOn ? '#38bdf8' : 'transparent'
      fanAuto.style.borderColor = !isOn ? '#38bdf8' : 'transparent'
    }
  } catch(e) {
    const el = document.getElementById(tid + '_status')
    if (el) el.textContent = 'Error: ' + e.message
  }
}

async function tccSetTemp(tid) {
  const valEl = document.getElementById(tid + '_val')
  if (!valEl) return
  const temp = _tccSetpoint[tid] || parseInt(valEl.textContent) || 72
  const mode = _tccMode[tid] || 'HEAT'
  const action = mode === 'COOL' ? 'setCool' : 'setHeat'
  try {
    await fetch('/api/tcc-thermostat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, value: temp }) })
    setTimeout(() => loadThermostatState(null, tid), 2000)
  } catch(e) { console.error('tccSetTemp error', e) }
}

async function tccSetFan(fanMode, tid) {
  try {
    await fetch('/api/tcc-thermostat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action: 'setFan', value: fanMode }) })
    const fanOn = document.getElementById(tid + '_fan_on')
    const fanAuto = document.getElementById(tid + '_fan_auto')
    if (fanOn) fanOn.style.borderColor = fanMode === 'on' ? '#38bdf8' : 'transparent'
    if (fanAuto) fanAuto.style.borderColor = fanMode === 'auto' ? '#38bdf8' : 'transparent'
    setTimeout(() => loadThermostatState(null, tid), 2000)
  } catch(e) { console.error('tccSetFan error', e) }
}

async function tccSetMode(mode, tid) {
  try {
    await fetch('/api/tcc-thermostat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action: 'setMode', value: mode }) })
    _tccMode[tid] = mode
    const modeColors = { HEAT: '#fb923c', COOL: '#93c5fd', AUTO: '#a78bfa', OFF: '#6b7280' }
    for (const m of ['HEAT','COOL','AUTO','OFF']) {
      const btn = document.getElementById(tid + '_m_' + m)
      if (btn) btn.style.borderColor = m === mode ? (modeColors[m] || '#7c6af7') : 'transparent'
    }
    setTimeout(() => loadThermostatState(null, tid), 3000)
  } catch(e) { console.error('tccSetMode error', e) }
}

async function shControl(endpointId, action, value, deviceName, colorName) {
  try {
    const r = await fetch('/api/alexa-smarthome-control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpointId, action, value, deviceName, colorName })
    })
    const d = await r.json()
    if (d.error) alert('Error: ' + d.error)
    if (d.errors?.length) console.warn('[alexa errors]', d.errors)
  } catch(e) { alert('Error: ' + e.message) }
}

  if (!usedHue) await shControl(endpointId, 'SetBrightness', pct)

async function setColor(btn, colorEid, powerEid, pid, h, s, b, colorName) {
  // Clear previous selection for this device, mark new one
  document.querySelectorAll(`[data-pid-color="${pid}"]`).forEach(b => { b.style.borderColor = '#334155'; b.style.boxShadow = '' })
  btn.style.borderColor = '#fff'
  btn.style.boxShadow = '0 0 0 3px #fff'
  applyPowerState(pid, true)  // optimistic: light on
  // Prefer direct Hue control (hue in 0-360, sat in 0-1, bri in 0-1 — server converts)
  const usedHue = await hueControl(pid, { on: true, hue: h, sat: s, bri: Math.round(b * 100) })
  if (!usedHue) {

    await shControl(colorEid, 'SetColor', { hue: h, saturation: s, brightness: b }, devInfo?.name, colorName)
  }
}

// Device display name overrides (Alexa name → friendly name)
const DEVICE_NAME_OVERRIDES = {
  'left lamp': "Gary's lamp",
  'right lamp': "Pam's lamp"
}
// Room overrides for devices whose names don't contain a room keyword
const DEVICE_ROOM_OVERRIDES = {
  "gary's lamp":          'Living Room',
  "pam's lamp":           'Living Room',
  'govee smart led desk': 'Basement',
  'string lights 6':      'Deck',
  'string lights 7':      'Deck',
  'floor lamp basic left':  'Basement',
  'floor lamp basic right': 'Basement',
  'downstairs patio door':  'Patio'
}

function extractRoom(name) {
  const lower = name.toLowerCase()
  if (DEVICE_ROOM_OVERRIDES[lower]) return DEVICE_ROOM_OVERRIDES[lower]
  const ROOMS = [
    // Multi-word first (longer matches take priority)
    'main bedroom','master bedroom','guest bedroom','kids bedroom','boys bedroom','girls bedroom',
    'living room','family room','great room','sitting room','sun room','sunroom',
    'dining room','laundry room','utility room','mud room','mudroom','play room','playroom',
    'game room','media room','theater room','home office',
    'backyard lights','backyard','front yard',
    // Single-word rooms
    'downstairs','upstairs','basement','attic',
    'bedroom','bathroom','kitchen','office','garage',
    'hallway','entryway','foyer','porch','patio',
    'den','study','gym','nursery','pantry','closet','stairway','stairs'
  ]
  for (const room of ROOMS) {
    if (lower.includes(room)) return room.split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join(' ')
  }
  return 'Other'
}

function groupByRoom(devs) {
  const rooms = {}
  for (const dev of devs) {
    const room = extractRoom(dev.name)
    if (!rooms[room]) rooms[room] = []
    rooms[room].push(dev)
  }
  // Sort: named rooms first alphabetically, 'Other' last
  // Within each room: device whose name matches the room name comes first, then alphabetical
  return Object.entries(rooms).sort(([a],[b]) => {
    if (a === 'Other') return 1
    if (b === 'Other') return -1
    return a.localeCompare(b)
  }).map(([room, roomDevs]) => {
    const roomLower = room.toLowerCase()
    roomDevs.sort((a, b) => {
      const aMatch = a.name.toLowerCase() === roomLower ? 0 : 1
      const bMatch = b.name.toLowerCase() === roomLower ? 0 : 1
      if (aMatch !== bMatch) return aMatch - bMatch
      return a.name.localeCompare(b.name)
    })
    return [room, roomDevs]
  })
}

            '<div style="display:none;padding:16px;text-align:center;color:#475569;font-size:11px">No snapshot available</div>' +
          '</div>'
          _camBatteryIds.push({ name: dev.name, camKey })
        } else if (cat === 'SMARTLOCK') {
          const lpid = 'lock_' + dev.endpointId.replace(/[^a-z0-9]/gi,'_').toLowerCase().substring(0,24)
          _shLockIds.push({ endpointId: dev.endpointId, pid: lpid })
          html += '<div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 12px;min-width:160px">' +
            '<div style="font-size:12px;color:#e2e8f0;font-weight:600;margin-bottom:8px">🔒 ' + dev.name + '</div>' +
            '<button id="' + lpid + '_toggle" onclick="lockToggle(\'' + dev.endpointId + '\',\'' + lpid + '\')" data-state="locked" ' +
              'style="width:100%;background:#166534;border:2px solid #4ade80;color:#fff;border-radius:4px;padding:5px;cursor:pointer;font-size:11px;font-weight:600">🔒 Locked</button>' +
          '</div>'
        } else if (cat === 'GARAGE_DOOR') {
          html += '<div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 12px;min-width:160px">' +
            '<div style="font-size:12px;color:#e2e8f0;font-weight:600;margin-bottom:8px">🏠 ' + dev.name + '</div>' +
            '<div style="display:flex;gap:6px">' +
              '<button onclick="shControl(\'' + dev.endpointId + '\',\'Open\',null)" ' +
                'style="flex:1;background:#1e3a5f;border:none;color:#93c5fd;border-radius:4px;padding:5px;cursor:pointer;font-size:11px;font-weight:600">⬆ Open</button>' +
              '<button onclick="shControl(\'' + dev.endpointId + '\',\'Close\',null)" ' +
                'style="flex:1;background:#374151;border:none;color:#d1d5db;border-radius:4px;padding:5px;cursor:pointer;font-size:11px;font-weight:600">⬇ Close</button>' +
            '</div>' +
          '</div>'
        } else if (cat === 'MOTION_SENSOR') {
          const sKey = 'sen_' + dev.name.replace(/[^a-z0-9]/gi,'_').toLowerCase()
          const isMailbox = dev.name.toLowerCase().includes('mail')
          const icon = isMailbox ? '📬' : '👁️'
          html += '<div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 12px;min-width:180px">' +
            '<div style="font-size:12px;color:#e2e8f0;font-weight:600;margin-bottom:6px">' + icon + ' ' + dev.name + '</div>' +
            '<div id="' + sKey + '_state" style="font-size:13px;font-weight:700;color:#64748b;margin-bottom:4px">—</div>' +
            '<div id="' + sKey + '_time" style="font-size:10px;color:#475569">Loading…</div>' +
            '<div id="' + sKey + '_dur" style="font-size:10px;color:#475569"></div>' +
          '</div>'
          _sensorIds.push({ name: dev.name, sKey, isMailbox })
        } else if (cat === 'TV') {
          const tpid = 'tv_' + dev.name.replace(/[^a-z0-9]/gi,'_').toLowerCase()
          _shPowerIds.push({ endpointId: dev.endpointId, pid: tpid })
          html += '<div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 12px;min-width:180px">' +
            '<div style="font-size:13px;color:#e2e8f0;font-weight:700;margin-bottom:8px">📺 ' + dev.name + '</div>' +
            '<button id="' + tpid + '_toggle" onclick="shToggle(\'' + dev.endpointId + '\',\'' + tpid + '\')" data-state="off" ' +
              'style="width:100%;background:#166534;border:2px solid #4ade80;color:#fff;border-radius:4px;padding:5px;cursor:pointer;font-size:11px">Off</button>' +
          '</div>'
        } else {
          // Generic toggle card
          const gpid = 'gen_' + dev.name.replace(/[^a-z0-9]/gi,'_').toLowerCase()
          _shPowerIds.push({ endpointId: dev.endpointId, pid: gpid })
          html += '<div style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:10px 12px;min-width:160px">' +
            '<div style="font-size:12px;color:#e2e8f0;font-weight:600;margin-bottom:8px">' + meta.icon + ' ' + dev.name + '</div>' +
            '<button id="' + gpid + '_toggle" onclick="shToggle(\'' + dev.endpointId + '\',\'' + gpid + '\')" data-state="off" ' +
              'style="width:100%;background:#166534;border:2px solid #4ade80;color:#fff;border-radius:4px;padding:5px;cursor:pointer;font-size:11px">Off</button>' +
          '</div>'
        }
        } // end for dev of roomDevs
      } // end for roomGroups
      html += '</div></div>'
    }

    html += '</div>'
    el.innerHTML = html
    setTimeout(() => {
      for (const { pid } of _shPowerIds) loadSavedBrightness(pid)
      loadHueBrightness()
      loadRingStates()
      fetchPowerStates()
      for (const { endpointId, tid } of _shThermostatIds) loadThermostatState(endpointId, tid)
      loadCameraBatteries()
      loadSensorEvents()
    }, 200)
  } catch(e) {
    el.innerHTML = '<p style="color:#f87171">⚠ ' + e.message + '</p>'
  }
}

async function loadApple() {
  const el = document.getElementById('tab-apple')
  el.innerHTML = '<p style="color:var(--muted)">Loading Apple devices…</p>'
  try {
    const r = await fetch('/api/device-battery')
    const d = await r.json()
    const devices = Object.entries(d.devices || {})

    const deviceIcon = (name) => {
      name = name.toLowerCase()
      if (name.includes('watch')) return '⌚'
      if (name.includes('ipad')) return '📱'
      if (name.includes('macbook') || name.includes('mac')) return '💻'
      return '📱'
    }

    const batteryBar = (pct) => {
      const color = pct >= 50 ? '#4ade80' : pct >= 20 ? '#fbbf24' : '#f87171'
      return '<div style="display:inline-block;width:60px;height:10px;background:#1e293b;border-radius:3px;vertical-align:middle;margin-right:6px">' +
        '<div style="width:' + Math.min(pct,100) + '%;height:100%;background:' + color + ';border-radius:3px"></div></div>' +
        '<span style="color:' + color + ';font-weight:600">' + pct + '%</span>'
    }

    const apiUrl = 'http://' + location.hostname + ':8442/api/device-battery'

    let content = '<div style="padding:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
        '<div style="font-size:13px;font-weight:700;color:#e2e8f0">🍎 Apple Devices — Battery</div>' +
        '<button onclick="loadApple()" style="background:none;border:1px solid #334155;color:#7c6af7;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:11px">↻ Refresh</button>' +
      '</div>'

    if (devices.length === 0) {
      content +=
        '<div style="background:#0f172a;border:1px solid #334155;border-radius:8px;padding:16px;color:#94a3b8;font-size:13px">' +
          '<p style="margin:0 0 12px">No devices reporting yet. Set up a Shortcut on each device to POST battery data here.</p>' +
          '<div style="background:#1e293b;border-radius:6px;padding:12px;font-family:monospace;font-size:11px;color:#7c6af7">' +
            'POST ' + apiUrl + '<br>' +
            '{ "device": "Gary\'s iPhone", "battery": 87, "charging": false }' +
          '</div>' +
        '</div>'
    } else {
      const rows = devices.sort((a,b) => a[0].localeCompare(b[0])).map(([name, info]) => {
        const ago = Math.round((Date.now() - new Date(info.at)) / 60000)
        const agoLabel = ago < 60 ? ago + 'm ago' : Math.round(ago/60) + 'h ago'
        const chargingLabel = info.charging ? ' ⚡' : ''
        return '<tr style="border-bottom:1px solid #1e293b">' +
          '<td style="padding:10px 8px;color:#e2e8f0;font-weight:600">' + deviceIcon(name) + ' ' + name + chargingLabel + '</td>' +
          '<td style="padding:10px 8px">' + batteryBar(info.battery) + '</td>' +
          '<td style="padding:10px 8px;color:#475569;font-size:11px">' + agoLabel + '</td>' +
        '</tr>'
      }).join('')

      content +=
        '<div style="overflow-x:auto">' +
          '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
            '<thead><tr style="border-bottom:1px solid #334155">' +
              '<th style="text-align:left;padding:6px 8px;color:#64748b;font-weight:600">Device</th>' +
              '<th style="text-align:left;padding:6px 8px;color:#64748b;font-weight:600">Battery</th>' +
              '<th style="text-align:left;padding:6px 8px;color:#64748b;font-weight:600">Last Seen</th>' +
            '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>' +
        '<div style="margin-top:12px;font-size:11px;color:#475569">POST endpoint: <span style="font-family:monospace;color:#7c6af7">' + apiUrl + '</span></div>'
    }

    content += '</div>'
    el.innerHTML = content
  } catch(e) {
    el.innerHTML = '<p style="color:#f87171">⚠ ' + e.message + '</p>'
  }
}

// ── Event History ────────────────────────────────────────────────────────────
async function loadEventHistory() {
  const el = document.getElementById('tab-events')
  // Build filter UI if not already present
  if (!document.getElementById('evt-filter-source')) {
    el.innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <select id="evt-filter-source" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:12px">
          <option value="">All Sources</option>
        </select>
        <input id="evt-filter-from" type="date" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:12px">
        <input id="evt-filter-to" type="date" style="background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px 10px;font-size:12px">
        <button onclick="queryEventHistory()" style="background:#7c6af7;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer">Search</button>
        <button onclick="clearEventFilters()" style="background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer">Clear</button>
        <span id="evt-count" style="color:#64748b;font-size:12px"></span>
      </div>
      <div id="evt-results"></div>`
    // Set default date range: last 7 days
    const today = new Date().toISOString().slice(0,10)
    const week = new Date(Date.now() - 7*86400000).toISOString().slice(0,10)
    document.getElementById('evt-filter-from').value = week
    document.getElementById('evt-filter-to').value = today
  }
  await queryEventHistory()
}

async function queryEventHistory() {
  const source = document.getElementById('evt-filter-source')?.value ?? ''
  const from   = document.getElementById('evt-filter-from')?.value ?? ''
  const to     = document.getElementById('evt-filter-to')?.value ?? ''
  const results = document.getElementById('evt-results')
  results.innerHTML = '<p style="color:var(--muted)">Loading…</p>'
  const params = new URLSearchParams()
  if (source) params.set('source', source)
  if (from)   params.set('from', from)
  if (to)     params.set('to', to)
  params.set('limit', '500')
  try {
    const r = await fetch('/api/event-history?' + params)
    const d = await r.json()
    // Populate source dropdown if needed
    const sel = document.getElementById('evt-filter-source')
    if (sel.options.length <= 1) {
      d.sources.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o) })
      if (source) sel.value = source
    }
    document.getElementById('evt-count').textContent = `${d.total} event${d.total!==1?'s':''}`
    const priorityColor = p => p==='critical'?'#f87171':p==='important'?'#fbbf24':'#9ca3af'
    const rows = d.events.map(e => {
      const t = new Date(e.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true})
      const pri = getEventPriorityClient(e)
      return `<tr>
        <td style="color:${priorityColor(pri)};white-space:nowrap">${pri}</td>
        <td style="color:#64748b;white-space:nowrap">${t}</td>
        <td style="color:#94a3b8">${e.source}</td>
        <td>${e.name}</td>
        <td style="color:#64748b">${e.previousState??''} → ${e.state}</td>
      </tr>`
    }).join('')
    results.innerHTML = rows
      ? `<table style="width:100%;font-size:12px;border-collapse:collapse">
          <tr>
            <th style="text-align:left;color:#64748b;padding:4px">Priority</th>
            <th style="text-align:left;color:#64748b;padding:4px">Time</th>
            <th style="text-align:left;color:#64748b;padding:4px">Source</th>
            <th style="text-align:left;color:#64748b;padding:4px">Device</th>
            <th style="text-align:left;color:#64748b;padding:4px">Change</th>
          </tr>${rows}</table>`
      : '<p style="color:var(--muted)">No events found for those filters.</p>'
  } catch(e) {
    results.innerHTML = `<p style="color:#f87171">Error: ${e.message}</p>`
  }
}

function clearEventFilters() {
  document.getElementById('evt-filter-source').value = ''
  const today = new Date().toISOString().slice(0,10)
  const week = new Date(Date.now() - 7*86400000).toISOString().slice(0,10)
  document.getElementById('evt-filter-from').value = week
  document.getElementById('evt-filter-to').value = today
  queryEventHistory()
}

function getEventPriorityClient(e) {
  if (e.source==='Ring' && e.category==='Motion') return 'critical'
  if (e.category==='Contact') return 'critical'
  if (e.source==='Ring' && e.category==='Sensor') return 'important'
  if (e.category==='Sensor') return 'important'
  return 'normal'
}
